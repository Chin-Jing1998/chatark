name: 构建 Windows 安装包

# 触发：手动运行，或推送 v* tag 时自动出 Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 允许创建 Release、上传 exe

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 编译渲染/主/预加载
        run: npm run build

      - name: 打包 Windows（x64 + arm64，NSIS 安装版 + Portable 便携版）
        run: npx electron-builder --win --x64 --arm64 --publish never

      - name: 上传构建产物（每次运行均保留）
        uses: actions/upload-artifact@v4
        with:
          name: ChatArk-Windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
          fail_on_unmatched_files: true
